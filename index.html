<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 AI 旅游小助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #F1FAF2;
            --green: #6FCB8A;        /* 艾绿 / 叶绿（主色） */
            --green-deep: #3FA873;   /* 山绿 / 深绿 */
            --green-soft: #DEF4E4;   /* 浅艾绿 */
            --grass: #A5D66A;        /* 葱绿（强调） */
            --mint: #7FD9C2;         /* 薄荷绿 */
            --mint-deep: #4FC4AC;
            --mint-soft: #E3F6F0;
            --sage: #C8E6C9;         /* 鼠尾草绿 */
            --sage-soft: #EFF8EF;
            --celadon: #BFE3C8;      /* 青瓷 / 碧 */
            --ink: #3C5743;          /* 墨绿褐文字 */
            --ink-soft: #7E9685;     /* 灰绿 */
            --card: #FFFFFF;
            --shadow: 0 10px 28px rgba(63, 168, 115, .18);
            --shadow-soft: 0 5px 16px rgba(120, 160, 135, .16);
            --radius: 22px;
        }

        html, body {
            height: 100%;
            font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--ink);
            background: var(--cream);
        }

        /* 清新的多绿意渐变 + 漂浮光斑背景 */
        body {
            background:
                radial-gradient(circle at 10% 15%, var(--green-soft) 0%, transparent 36%),
                radial-gradient(circle at 90% 85%, var(--mint-soft) 0%, transparent 40%),
                radial-gradient(circle at 75% 10%, var(--sage-soft) 0%, transparent 30%),
                radial-gradient(circle at 20% 90%, var(--celadon) 0%, transparent 26%),
                var(--cream);
        }

        .layout { display: flex; height: 100vh; overflow: hidden; }

        /* ===== 左侧边栏（浅绿渐变卡片） ===== */
        .sidebar {
            width: 232px; min-width: 232px;
            background: linear-gradient(165deg, #EAF8EC 0%, #E3F3EA 100%);
            display: flex; flex-direction: column;
            padding: 18px 14px;
            border-right: 2px solid #D6EEDD;
        }
        .logo {
            display: flex; align-items: center; gap: 9px;
            margin-bottom: 18px; padding: 6px 8px;
        }
        .logo .emoji { font-size: 28px; }
        .logo .name {
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            font-size: 20px; color: var(--green-deep);
        }
        .new-chat-btn {
            width: 100%; padding: 13px 0;
            background: linear-gradient(135deg, var(--green), var(--green-deep));
            color: #fff; border: none; border-radius: 18px;
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            font-size: 17px; cursor: pointer;
            box-shadow: 0 6px 16px rgba(63, 168, 115, .4);
            transition: transform .15s, box-shadow .15s;
        }
        .new-chat-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 9px 20px rgba(63, 168, 115, .5); }
        .new-chat-btn:active { transform: scale(.97); }

        .conv-list { flex: 1; overflow-y: auto; margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }
        .conv-item {
            width: 100%; text-align: left;
            padding: 11px 14px;
            background: #fff; color: var(--ink);
            border: 2px solid #D6EEDD; border-radius: 16px;
            font-size: 15px; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: transform .15s, border-color .15s, background .15s;
        }
        .conv-item:hover { transform: translateX(3px); border-color: var(--green); background: #EAF8EC; }
        .conv-item.active { background: linear-gradient(135deg, var(--green-soft), #FFF); border-color: var(--green); color: var(--green-deep); font-weight: 600; }

        /* ===== 主区域 ===== */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: transparent; }
        .app-title {
            text-align: center;
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            font-size: 28px; color: var(--green-deep);
            padding: 18px 0 10px; letter-spacing: 1px;
            text-shadow: 0 2px 0 var(--green-soft);
        }
        .app-title .sub {
            display: block; font-family: 'Quicksand', sans-serif;
            font-size: 13px; color: var(--ink-soft); font-weight: 600;
            margin-top: 3px; letter-spacing: 0;
        }

        .chat-panel {
            flex: 1; width: auto;
            margin: 0 18px 16px;
            display: flex; flex-direction: column;
            border: 2px solid #D6EEDD; border-radius: var(--radius);
            background: rgba(255, 255, 255, .82);
            backdrop-filter: blur(4px);
            overflow: hidden; box-shadow: var(--shadow-soft);
        }

        #chatBox { flex: 1; overflow-y: auto; padding: 20px 24px; }

        /* ===== 右侧行程地图面板 ===== */
        .map-panel {
            width: 40%; min-width: 360px; max-width: 660px;
            display: flex; flex-direction: column;
            border-left: 2px solid #D6EEDD; background: rgba(255, 255, 255, .82);
        }
        .map-header {
            text-align: center;
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            font-size: 22px; font-weight: 700; color: var(--green-deep);
            padding: 18px 0 12px;
        }
        #mapContainer { flex: 1; position: relative; background: #EAF8EC; border: 2px dashed #BFE3C8; margin: 0 14px; border-radius: 16px; overflow: hidden; }
        .map-status {
            margin: 12px 14px 14px;
            padding: 11px 16px; font-size: 14px; color: var(--ink);
            background: linear-gradient(135deg, var(--green-soft), #FFF);
            border: 2px solid #CDEBD6; border-radius: 16px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            box-shadow: var(--shadow-soft);
        }
        .map-fallback { padding: 40px 24px; text-align: center; color: var(--ink-soft); font-size: 15px; line-height: 2; }

        /* 地图标记：水滴形可爱点 + 圆角标签 */
        .amap-pin { display: flex; flex-direction: column; align-items: center; }
        .amap-pin .pin-dot {
            width: 18px; height: 18px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: var(--pin, #3FA873); border: 3px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .amap-pin .pin-label {
            margin-top: 8px; padding: 2px 9px;
            background: rgba(255,255,255,.95); border-radius: 12px;
            font-size: 13px; color: var(--ink); white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,.15); font-weight: 600;
            border: 1px solid #D6EEDD;
        }

        /* 欢迎卡片 */
        .welcome { padding: 28px 32px; }
        .welcome h3 { font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif; font-size: 24px; color: var(--green-deep); margin-bottom: 14px; }
        .welcome p { font-size: 16px; color: var(--ink-soft); margin-bottom: 10px; }
        .welcome ul { list-style: none; }
        .welcome li {
            margin: 10px 0; font-size: 15.5px; color: var(--ink);
            background: #EAF8EC; border: 2px solid #D6EEDD; border-radius: 16px;
            padding: 10px 14px;
        }
        .welcome li b { color: var(--green-deep); }
        .welcome a {
            color: var(--mint-deep); font-weight: 600; cursor: pointer;
            text-decoration: none; border-bottom: 2px dotted var(--mint-deep);
            transition: color .15s, border-color .15s;
        }
        .welcome a:hover { color: var(--green-deep); border-color: var(--green-deep); }

        .msg { display: flex; margin-bottom: 18px; animation: pop .35s cubic-bezier(.34,1.56,.64,1); }
        .msg.user { justify-content: flex-end; }
        .msg.agent { justify-content: flex-start; }
        @keyframes pop { 0% { opacity: 0; transform: translateY(10px) scale(.96); } 100% { opacity: 1; transform: none; } }

        .bubble {
            max-width: 88%; padding: 16px 20px;
            border-radius: 22px; font-size: 18px; line-height: 1.85;
            word-break: break-word; overflow-wrap: anywhere;
            box-shadow: var(--shadow-soft);
        }
        .msg.user .bubble { background: linear-gradient(135deg, var(--green), var(--green-deep)); color: #fff; border-bottom-right-radius: 8px; }
        .msg.agent .bubble { background: #fff; color: var(--ink); border: 2px solid #D6EEDD; border-bottom-left-radius: 8px; }

        /* 智能体回复内的 Markdown 样式 */
        .bubble.md h1, .bubble.md h2, .bubble.md h3, .bubble.md h4 { margin: 12px 0 8px; line-height: 1.4; color: var(--green-deep); }
        .bubble.md h1 { font-size: 24px; } .bubble.md h2 { font-size: 21px; } .bubble.md h3 { font-size: 19px; } .bubble.md h4 { font-size: 17px; }
        .bubble.md p { margin: 7px 0; }
        .bubble.md ul, .bubble.md ol { margin: 7px 0 7px 22px; }
        .bubble.md li { margin: 4px 0; }
        .bubble.md strong { font-weight: 700; color: var(--green-deep); }
        .bubble.md table { border-collapse: collapse; margin: 12px 0; width: auto; max-width: 100%; display: block; overflow-x: auto; font-size: 16.5px; }
        .bubble.md th, .bubble.md td { border: 1px solid #C2E3CC; padding: 9px 14px; text-align: left; }
        .bubble.md th { background: var(--green-soft); color: var(--green-deep); font-weight: 600; }
        .bubble.md img { max-width: 100%; max-height: 560px; border-radius: 16px; margin: 8px 2px; display: block; }
        .bubble.md hr { border: none; border-top: 2px dotted #C2E3CC; margin: 12px 0; }
        .bubble.md code { background: #EAF8EC; padding: 2px 7px; border-radius: 8px; font-size: 15px; color: var(--green-deep); }
        .bubble.md blockquote { border-left: 4px solid var(--mint); padding: 8px 12px; color: var(--ink-soft); margin: 7px 0; background: var(--mint-soft); border-radius: 0 12px 12px 0; }

        /* 工具调用等状态提示 */
        .status-line { font-size: 14.5px; color: var(--ink-soft); margin: 5px 0; background: var(--sage-soft); border-radius: 12px; padding: 6px 12px; border: 1px solid #CDEBD6; }

        /* 思考中指示 */
        .thinking { color: var(--green-deep); font-size: 16px; font-weight: 600; }
        .thinking .dot { animation: blink 1.2s infinite; }
        .thinking .dot:nth-child(2) { animation-delay: .3s; }
        .thinking .dot:nth-child(3) { animation-delay: .6s; }
        @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

        /* ===== 底部输入栏 ===== */
        .input-bar {
            display: flex; gap: 12px; align-items: center;
            padding: 14px 18px; border-top: 2px solid #D6EEDD; background: rgba(255, 255, 255, .7);
        }
        .input-bar input {
            flex: 1; height: 50px; padding: 0 20px;
            border: 2px solid #BFE3C8; border-radius: 25px;
            font-size: 17px; outline: none; background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }
        .input-bar input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(111, 203, 138, .22); }
        .input-bar input::placeholder { color: #A9C4AE; }
        .input-bar button {
            height: 50px; padding: 0 30px;
            background: linear-gradient(135deg, var(--green), var(--green-deep));
            color: #fff; border: none; border-radius: 25px;
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            font-size: 18px; cursor: pointer;
            box-shadow: 0 6px 16px rgba(63, 168, 115, .4);
            transition: transform .15s, box-shadow .15s;
            display: flex; align-items: center; gap: 6px;
        }
        .input-bar button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 9px 20px rgba(63, 168, 115, .5); }
        .input-bar button:active { transform: scale(.96); }
        .input-bar button:disabled { background: #CFE9D8; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 可爱滚动条 */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 10px; border: 2px solid var(--cream); }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">
            <span class="emoji">🌿</span>
            <span class="name">旅行小精灵</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">🌱 新建对话</button>
        <div class="conv-list" id="convList"></div>
    </aside>
    <main class="main">
        <h1 class="app-title">🌿 AI 旅游小助手<span class="sub">清新陪你逛遍好风景～</span></h1>
        <div class="chat-panel">
            <div id="chatBox"></div>
            <div class="input-bar">
                <input type="text" id="userInput"
                       placeholder="想去哪玩呀？比如：北京3日游、上海酒店、成都美食、漳州天气…"
                       autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">🌿 发送</button>
            </div>
        </div>
    </main>
    <section class="map-panel">
        <div class="map-header">🗺️ 行程地图</div>
        <div id="mapContainer"></div>
        <div class="map-status" id="mapStatus">地图加载中…</div>
    </section>
</div>
<script src="/static/js/travel_map.js"></script>
<script src="/static/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</body>
</html>
